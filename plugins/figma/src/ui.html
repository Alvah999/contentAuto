<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #1e1e1e;
        --panel: #2c2c2c;
        --text: #f5f5f5;
        --muted: #a0a0a0;
        --accent: #18a0fb;
        --border: #444;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 12px/1.4 Inter, system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 12px;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 8px;
        font-weight: 600;
      }
      p {
        margin: 0 0 10px;
        color: var(--muted);
      }
      textarea {
        width: 100%;
        height: 220px;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px;
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      button {
        border: none;
        border-radius: 6px;
        padding: 8px 12px;
        cursor: pointer;
        font-weight: 600;
      }
      button.primary {
        background: var(--accent);
        color: #fff;
      }
      button.ghost {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
      }
      #status {
        margin-top: 10px;
        color: var(--muted);
        min-height: 1.2em;
      }
      #status.error { color: #ff8f8f; }
      #status.ok { color: #7dcea0; }
    </style>
  </head>
  <body>
    <h1>Import Design Spec</h1>
    <p>
      Paste a contentAuto DesignSpec JSON (from the dashboard download). Creates a
      <strong>new</strong> editable frame — never overwrites reference templates.
    </p>
    <textarea id="spec" placeholder='{"version":"1.0", ...}'></textarea>
    <div class="row">
      <button class="primary" id="import">Create editable design</button>
      <button class="ghost" id="close">Close</button>
    </div>
    <div id="status"></div>
    <script>
      const statusEl = document.getElementById("status");
      const specEl = document.getElementById("spec");

      document.getElementById("close").onclick = () => {
        parent.postMessage({ pluginMessage: { type: "close" } }, "*");
      };

      document.getElementById("import").onclick = () => {
        statusEl.className = "";
        statusEl.textContent = "Importing…";
        let parsed;
        try {
          parsed = JSON.parse(specEl.value);
        } catch (err) {
          statusEl.className = "error";
          statusEl.textContent = "Invalid JSON: " + err.message;
          return;
        }
        parent.postMessage({ pluginMessage: { type: "import-spec", spec: parsed } }, "*");
      };

      onmessage = (event) => {
        const msg = event.data.pluginMessage;
        if (!msg) return;
        if (msg.type === "result") {
          statusEl.className = msg.ok ? "ok" : "error";
          statusEl.textContent = msg.message;
        }
      };
    </script>
  </body>
</html>
